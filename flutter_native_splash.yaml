flutter_native_splash:
  web: false
  ios: true

  #! FOR ALL PLATFORM, except Android 12+:

  color: '#9A7FFE'

  image: assets/splash/splash.png
  fullscreen: true # default false

  android_gravity: fill # oder: center, fill, contain, cover
  ios_content_mode: scaleAspectFill # croppt statt stretchen

  #! ANDROID 12+ configuration:
  android_12:
    # background color
    color: '#9A7FFE'
    image: assets/icons/JUP.png
    # Vergrößert das Icon-Fenster der Android-12-Splash-API von ~108dp auf ~128dp.
    # Identische Farbe wie color → unsichtbarer Kreis, aber Logo wird größer dargestellt.
    icon_background_color: '#9A7FFE'
